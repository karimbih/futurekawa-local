services:
  db:
    image: postgres:16-alpine
    container_name: futurekawa-local-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: futurekawa
      POSTGRES_PASSWORD: futurekawa
      POSTGRES_DB: futurekawa_local
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futurekawa -d futurekawa_local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
